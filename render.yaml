services:
  - type: web
    name: youtube-video-downloader-backend
    runtime: node
    rootDir: backend
    buildCommand: pip install yt-dlp && npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: YTDLP_PATH
        value: yt-dlp
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: TEMP_DIR
        value: ./temp
      - key: FRONTEND_URL
        value: https://youtube-video-downloader-two-iota.vercel.app
